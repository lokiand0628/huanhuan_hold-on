name: Release

on:
  push:
    tags:
      - 'v*'

env:
  NODE_OPTIONS: --use-system-ca

jobs:
  release:
    # 只出 Apple Silicon。没有 Windows/Linux 矩阵，也没有 scoop manifest 要回写。
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install frontend dependencies
        run: npm ci

      # tauri-action refuses to run when a release for the tag already exists.
      # Deleting first makes a re-run of the same tag idempotent instead of a red X.
      - name: Remove stale release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${{ github.ref_name }}" --repo "${{ github.repository }}" --yes || true

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 缓缓 ${{ github.ref_name }}
          releaseBody: |
            ## 缓缓 ${{ github.ref_name }}

            macOS (Apple Silicon) 专用。下载下面的 `.dmg`，打开后把「缓缓」拖进「应用程序」。

            ### 首次打开被拦下

            这个包没有 Apple 开发者签名，也没有公证，所以第一次打开会提示「无法验证开发者」。
            在「终端」里跑一次即可：

            ```bash
            xattr -dr com.apple.quarantine /Applications/缓缓.app
            ```

            或者在「访达」里右键点「缓缓」→「打开」→ 再点一次「打开」。

            ### 完整更新说明

            见 [README](https://github.com/${{ github.repository }}#版本记录)。
          releaseDraft: false
          prerelease: false
          # createUpdaterArtifacts 已关（见 tauri.conf.json），所以不需要
          # TAURI_SIGNING_PRIVATE_KEY，也不会产出 latest.json。
          args: --target aarch64-apple-darwin --bundles dmg

      # productName 是「缓缓」，Tauri 产出的 dmg 因此叫 `缓缓_0.0.1_aarch64.dmg`。
      # GitHub 上传资产时会把非 ASCII 的前缀整段抹掉，最后挂上去的只剩
      # `_0.0.1_aarch64.dmg` —— 下载下来像个坏文件。这里把**资产名**改成 ASCII 的，
      # release 标题里的「缓缓」不受影响。
      #
      # 取 id 有个坑：**不能**用 `--json assets` 里的 `.id` —— 那是 node_id
      # （`RA_kwDO…`），而 `/releases/assets/<id>` 要的是 URL 末段的数字 id。
      # 拿 node_id 去问，GitHub 回 404 而不是 400（这个坑让 v0.0.1 那次发布红过），
      # 所以数字 id 只从 apiUrl 里取，并且加一道"必须是纯数字"的校验。
      - name: Give the dmg an ASCII filename
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          ascii="Huanhuan_${tag#v}_aarch64.dmg"

          gh release view "$tag" --repo "${{ github.repository }}" \
              --json assets \
              --jq '.assets[]
                    | select(.name | endswith(".dmg"))
                    | "\(.apiUrl | split("/") | last) \(.name)"' |
          while read -r id name; do
            if [ "${name#Huanhuan_}" != "$name" ]; then
              continue          # 已经是 ASCII 名字 → 重跑幂等
            fi
            case "$id" in
              '' | *[!0-9]*)
                echo "::error::资产 id 不是纯数字（取到的是 node_id？）：$id"
                exit 1
                ;;
            esac
            gh api -X PATCH \
              "repos/${{ github.repository }}/releases/assets/$id" \
              -f "name=$ascii" >/dev/null
            echo "renamed: $name -> $ascii"
          done
